name: Rust CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Consumer example
        run: cargo run --example consume
      - name: CLI smoke test
        run: cargo run -- assess --catalogue fixtures/catalogue.json --evidence fixtures/evidence.json --policy fixtures/policy.json
