[package]
name = "asvs-evidence"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "Embeddable, offline-first evidence assessment engine for application security"
license = "MIT"
repository = "https://github.com/SecMantra/sm-asvs-evidence"
readme = "README.md"
keywords = ["asvs", "security", "evidence", "devsecops"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "asvs_evidence"
path = "src/lib.rs"

[[bin]]
name = "asvs-evidence"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
